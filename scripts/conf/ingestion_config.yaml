# Bronze layer ingestion parameters

# Unity Catalog: paths 
unity_catalog:
  catalog: fca_copernicus
  bronze_schema: bronze
  control_schema: control
  volume_name: sentinel2_raw
  # Delta table with the indexed STAC catalog (source of scenes to download!)
  stac_source_table: fca_copernicus.bronze.sentinel2_stac_raw

# CDSE: API endpoints
cdse:
  token_url: "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token"
  odata_base: "https://catalogue.dataspace.copernicus.eu/odata/v1"
  stac_catalog_url: "https://stac.dataspace.copernicus.eu/v1"
  secret_scope: cdse

# Retry policy
retry_policy:
  max_retries: 3
  backoff_base_seconds: 5  # 5s, 10s, 20s...

# Filters/thresholds
ingestion:
  max_cloud_cover_pct: 90.0 
  log_flush_every: 5  # control table flush scene count

# Discovery STAC (for the exploration/check phase, not ingestion)
stac_discovery:
  collection: sentinel-2-l2a
  active_aoi: sanjuan_v1   

  aois:
    sanjuan_v1:
      bbox: [-67.998333, -31.803333, -67.965, -31.771944]
      start_date: "2024-01-01"
      end_date: "2024-12-31"
    tucuman_v1:
      bbox: [-66.0, -27.5, -65.0, -26.5]
      start_date: "2024-06-01"
      end_date: "2024-06-05"

silver:
  schema: silver
  volume_name: sentinel2_ard                       # Volume for Silver rasters (created if missing)
  scene_qa_table: fca_copernicus.silver.scene_qa   # per-scene QA + Silver idempotency log
  bands: [B04_10m, B04_20m, B08_10m, B11_20m, B12_20m]                      
                                                   # TODO(science): confirm band list and order
  # target_resolution_m: 10                          
  target_crs: native                               # "native" = keep the scene UTM CRS; reprojection not implemented
  aoi_buffer_m: 0                                  # extra margin around the AOI bbox, in metres

  # SCL classes counted as invalid in QA and masked in the raster if mask_scl_in_raster = true:
  # 0 no_data, 1 saturated/defective, 3 cloud shadows, 8/9 cloud medium/high prob, 10 thin cirrus, 11 snow/ice.
  # Should I add 2 d(ark area pixels -topographic shadow) and 7 (unclassified)?
  invalid_scl_classes: [0, 1, 3, 8, 9, 10, 11]     # TODO(science): confirm the list, esp. 2, 7 and 11
  mask_scl_in_raster: true                         # false = raster keeps reflectance; only NODATA/SATURATED DNs become NaN

  # Operational keys: changing these does NOT trigger reprocessing (excluded from config_hash)
  max_workers: 2
  max_window_pixels: 25000000                      # guard against loading a whole tile into memory
  log_flush_every: 5
  scene_limit: 2                                   # trial run: process only N scenes. Set to null for the full run
  local_tmp_root: null                             # null = system temp dir

